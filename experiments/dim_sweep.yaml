# Dimension sweep (gyro): does hyperbolic aggregation beat flat once d_model is small?
difficulties:
  - {name: medium, k: 3, max_depth: 25}
  - {name: hard,   k: 5, max_depth: 50}

dims: [4, 8, 16, 32]
kappa_grid: [-2.0, -1.0, -0.5, 0.0]
seeds: 3
emb_scale: 1.0
attention_mode: gyro

model:
  n_layers: 2
  n_heads: 1
  geodesic_output: true

train:
  steps: 2000
  batch_size: 64
  seq_len: 128
  lr: 3.0e-3
  device: cuda
  log_every: 50
