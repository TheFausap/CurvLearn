# Per-subspace mixed curvature: shared vs per-head learnable kappa in the crossover regime.
regimes:
  - {name: medium, k: 3, max_depth: 25, dim: 4, n_heads: 2}
  - {name: hard,   k: 5, max_depth: 50, dim: 8, n_heads: 4}

factors: [shared, per_head]     # shared = 1 kappa for all heads; per_head = 1 kappa per head
seeds: 3
emb_scale: 1.0

train:
  steps: 2000
  batch_size: 64
  seq_len: 128
  lr: 3.0e-3
  kappa_lr: 2.0e-2      # lowered from 5e-2: geodesic readout gives kappa a strong gradient
  device: cuda
# Readout: ProductGyroLM now uses a per-head curvature-coupled geodesic decode
# (geodesic_output=True), so kappa is coupled to the likelihood, not just the aggregation.
