[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "curvlearn"
version = "0.1.0"
description = "Tunable-curvature representation spaces for language models"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/TheFausap/CurvLearn"

[tool.setuptools]
packages = ["curvlearn"]
